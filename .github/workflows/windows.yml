name: Windows x64 test package

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alandtse/CommonLibSSE-NG
          ref: 9955ae3b18dd0aedbebb58fa207a4b7180eb6d67
          path: .deps/CommonLibSSE-NG
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NVIDIAGameWorks/Streamline
          ref: 625db07d4bca5abc67d781c42af7e7fb0761f1b6
          path: .deps/streamline
          sparse-checkout: |
            include
            external/ngx-sdk/include
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: 7539ae8b6568ad29ed78a753404351daf3b5cca7
          path: .deps/FidelityFX-SDK
          sparse-checkout: |
            Kits/FidelityFX/api/include
            Kits/FidelityFX/framegeneration/include
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/vcpkg
          ref: ee12231b20c95013c6638d845d04c91559a1d1ff
          path: .deps/vcpkg
          persist-credentials: false
      - name: Offline regressions (real exit codes)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-logs | Out-Null
          Get-ChildItem tools/regress_*.py | ForEach-Object {
            python $_.FullName 2>&1 | Tee-Object ".ci-logs/$($_.BaseName).log"
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $($_.Name)" }
          }
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | Tee-Object .ci-logs/unittest.log
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Bootstrap pinned vcpkg
        shell: cmd
        run: .deps\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: WARP presentation regression
        shell: pwsh
        run: |
          cmd /c build_vs.bat --present-only 2>&1 | Tee-Object .ci-logs/warp-build.log
          $warpStatus = $LASTEXITCODE
          if (Test-Path build/present-smoke/Testing/Temporary/LastTest.log) {
            Select-String -Path build/present-smoke/Testing/Temporary/LastTest.log -Pattern 'frames verified|SKIP:|Debug layer unavailable|D3D12 validation:' | ForEach-Object {
              Write-Output "::notice title=WARP result::$($_.Line)"
            }
          }
          if ($warpStatus -ne 0) {
            if (Test-Path build/present-smoke/present_smoke.exe) {
              & ./build/present-smoke/present_smoke.exe
              $processStatus = $LASTEXITCODE
              Write-Output ("::error title=WARP process exit::code={0} hex=0x{1:X8}" -f $processStatus, ($processStatus -band 0xffffffffL))
            }
            foreach ($library in @('d3d12.dll','d3d11.dll','dxgi.dll','d3d10warp.dll','msvcp140.dll','vcruntime140_1.dll')) {
              $file = Join-Path $env:windir "System32/$library"
              Write-Output "::notice title=Runtime dependency::$library exists=$(Test-Path $file)"
            }
            if (Test-Path build/present-smoke/Testing/Temporary/LastTest.log) {
              Get-Content build/present-smoke/Testing/Temporary/LastTest.log | Select-Object -Last 40 | ForEach-Object {
                $message = $_.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Output "::error title=WARP diagnostic::$message"
              }
            }
            throw "WARP validation failed with exit code $warpStatus"
          }
      - name: Configure, compile actual DLL, and test
        shell: pwsh
        run: |
          cmd /c build_vs.bat --dll-only 2>&1 | Tee-Object .ci-logs/windows-build.log
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed with exit code $LASTEXITCODE" }
      - name: Package for MO2 (no third-party runtime DLLs)
        shell: pwsh
        run: |
          cmake --install build/windows-release --prefix package
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          if (!(Test-Path package/SKSE/Plugins/DynamicShaderFrameGen.dll)) { throw 'DLL was not built' }
          Get-FileHash package/SKSE/Plugins/DynamicShaderFrameGen.dll -Algorithm SHA256 | Format-List | Out-File package/SHA256.txt
          git rev-parse HEAD | Out-File package/COMMIT.txt
          Copy-Item build/present-smoke/Testing/Temporary/LastTest.log package/VALIDATION-WARP.txt
          'FG=0, NR=0 menu/save-load test. Read FG0_PRESENT_TEST.md; build commit is in COMMIT.txt.' | Set-Content package/NEXT-TEST.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DynamicShaderFrameGen-FG0-Present-${{ github.sha }}
          path: package/
          if-no-files-found: error
      - name: Upload configure/build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-diagnostics
          path: |
            .ci-logs/
            build/present-smoke/Testing/Temporary/LastTest.log
            build/windows-release/CMakeCache.txt
            build/windows-release/CMakeFiles/CMakeConfigureLog.yaml
            .deps/vcpkg/buildtrees/**/config-*.log
            .deps/vcpkg/buildtrees/**/install-*.log
          if-no-files-found: ignore
      - name: Diagnostic summary
        if: failure()
        shell: pwsh
        run: |
          '### Failed validation/build diagnostics' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem .ci-logs/*.log -ErrorAction SilentlyContinue | ForEach-Object {
            $errors = Select-String -Path $_.FullName -Pattern 'error|fatal|failed|exception|traceback|Unicode' -Context 2,4
            if ($errors) {
              "#### $($_.Name)" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              $errors | Select-Object -Last 15 | Out-String -Width 220 >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
              # Public run annotations make the concrete build failure reviewable
              # even when viewing/downloading full Actions logs requires sign-in.
              $errors | Select-Object -Last 12 | ForEach-Object {
                $message = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Build diagnostic::$message"
              }
            }
          }
