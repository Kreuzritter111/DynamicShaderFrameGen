[FrameGeneration]
; Test baseline: SE 1.5.97 / SKSE 2.0.20, 1920x1080, ENB NAT III.
; Enable controls the proxy, not frame interpolation. Keep it on for DLAA.
Enable=1
ForceEnable=0
ForceBorderless=1
FrameGeneration=0
Provider=0
EnableUpscale=1
QualityMode=0
RenderResolutionScale=1.0
Sharpness=0.0
PresetDLSS=0
MvecScaleOverride=1.0
; First establish DLAA quality. Then set this to 1 for the separate NR test.
; The unmodified signed Feature 18 runtime may reject this private API path.
NeuralRenderingEnabled=0
NRAllowWithFrameGen=0
NRRenderScale=1.0
NRLayers=1
NRIntensity=0.8
NRLocalTone=0.75
NRLocalStructure=0.9
NRSkinStructure=0.9
NRStyle=3
NRAutoMask=1
NRUICorrection=0
DLSSGFramesToGenerate=1
MFGMaxFramesOverride=0
MfgLadderProbe=0
MenuDrawHook=0
PollInputHook=0
PixelProbe=0
FpsOverlay=0
StreamlineLogLevel=2
